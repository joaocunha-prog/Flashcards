<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">ECG normal x ECG na síndrome de WPW</text>

  <!-- ===== Normal ECG panel ===== -->
  <text x="20" y="70" font-size="16" font-weight="bold" fill="#1a1a1a">ECG normal</text>
  <line x1="20" y1="120" x2="700" y2="120" stroke="#cccccc" stroke-width="1"/>
  <!-- baseline -->
  <path d="M 40 120 L 90 120 L 100 105 L 110 120 L 130 120 L 140 60 L 150 130 L 160 90 L 170 120 L 220 120"
        fill="none" stroke="#1a5fb4" stroke-width="3"/>
  <!-- P wave label -->
  <text x="98" y="98" font-size="13" fill="#1a5fb4" text-anchor="middle">P</text>
  <!-- PR interval bracket -->
  <line x1="100" y1="145" x2="140" y2="145" stroke="#2e7d32" stroke-width="2"/>
  <line x1="100" y1="140" x2="100" y2="150" stroke="#2e7d32" stroke-width="2"/>
  <line x1="140" y1="140" x2="140" y2="150" stroke="#2e7d32" stroke-width="2"/>
  <text x="120" y="163" font-size="13" fill="#2e7d32" text-anchor="middle">PR normal</text>
  <!-- QRS label -->
  <text x="150" y="55" font-size="13" fill="#1a5fb4" text-anchor="middle">QRS estreito</text>

  <!-- ===== WPW ECG panel ===== -->
  <text x="20" y="210" font-size="16" font-weight="bold" fill="#1a1a1a">ECG no WPW</text>
  <line x1="20" y1="260" x2="700" y2="260" stroke="#cccccc" stroke-width="1"/>
  <!-- baseline with delta wave slur before QRS -->
  <path d="M 40 260 L 90 260 L 100 245 L 110 260 L 118 260 L 128 245 L 140 200 L 150 270 L 160 230 L 170 260 L 220 260"
        fill="none" stroke="#c01c28" stroke-width="3"/>
  <!-- P wave label -->
  <text x="98" y="238" font-size="13" fill="#c01c28" text-anchor="middle">P</text>
  <!-- short PR bracket -->
  <line x1="100" y1="285" x2="118" y2="285" stroke="#2e7d32" stroke-width="2"/>
  <line x1="100" y1="280" x2="100" y2="290" stroke="#2e7d32" stroke-width="2"/>
  <line x1="118" y1="280" x2="118" y2="290" stroke="#2e7d32" stroke-width="2"/>
  <text x="109" y="303" font-size="12" fill="#2e7d32" text-anchor="middle">PR curto</text>
  <!-- delta wave callout -->
  <line x1="123" y1="248" x2="123" y2="225" stroke="#9a5b00" stroke-width="1.5"/>
  <text x="123" y="218" font-size="13" fill="#9a5b00" text-anchor="middle">onda delta</text>
  <!-- QRS label -->
  <text x="155" y="190" font-size="13" fill="#c01c28" text-anchor="middle">QRS alargado</text>

  <!-- Legend / summary box -->
  <rect x="380" y="230" width="320" height="70" fill="#fdf2f2" stroke="#c01c28" stroke-width="1.5" rx="6"/>
  <text x="395" y="252" font-size="14" font-weight="bold" fill="#c01c28">Tríade do WPW:</text>
  <text x="395" y="272" font-size="13" fill="#1a1a1a">PR curto (&lt;120 ms) + onda delta</text>
  <text x="395" y="290" font-size="13" fill="#1a1a1a">+ QRS alargado</text>
</svg>
