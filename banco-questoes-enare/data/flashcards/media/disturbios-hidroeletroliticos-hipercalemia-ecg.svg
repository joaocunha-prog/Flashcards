<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="auto" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="260" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Hipercalemia — sequência de gravidade no ECG</text>

  <!-- Step 1 -->
  <rect x="20" y="70" width="195" height="100" rx="10" fill="#e6f4ea" stroke="#1e7d32" stroke-width="2"/>
  <text x="117" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#134a1c">1. Onda T apiculada</text>
  <text x="117" y="122" text-anchor="middle" font-size="11" fill="#134a1c">(alta, simétrica, em "tenda")</text>
  <text x="117" y="145" text-anchor="middle" font-size="11" fill="#134a1c">achado mais precoce</text>

  <!-- Arrow 1 -->
  <line x1="215" y1="120" x2="248" y2="120" stroke="#555" stroke-width="3"/>
  <polygon points="248,113 260,120 248,127" fill="#555"/>

  <!-- Step 2 -->
  <rect x="262" y="70" width="195" height="100" rx="10" fill="#fff4e5" stroke="#b5651d" stroke-width="2"/>
  <text x="359" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4310">2. Alargamento do QRS</text>
  <text x="359" y="122" text-anchor="middle" font-size="11" fill="#7a4310">condução intraventricular</text>
  <text x="359" y="140" text-anchor="middle" font-size="11" fill="#7a4310">lentificada</text>

  <!-- Arrow 2 -->
  <line x1="457" y1="120" x2="490" y2="120" stroke="#555" stroke-width="3"/>
  <polygon points="490,113 502,120 490,127" fill="#555"/>

  <!-- Step 3 -->
  <rect x="504" y="70" width="195" height="100" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
  <text x="601" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1a15">3. Perda da onda P</text>
  <text x="601" y="122" text-anchor="middle" font-size="11" fill="#7a1a15">bloqueio de condução</text>
  <text x="601" y="140" text-anchor="middle" font-size="11" fill="#7a1a15">atrial</text>

  <!-- Arrow 3 -->
  <line x1="699" y1="120" x2="732" y2="120" stroke="#555" stroke-width="3"/>
  <polygon points="732,113 744,120 732,127" fill="#555"/>

  <!-- Step 4 -->
  <rect x="746" y="70" width="134" height="100" rx="10" fill="#3a0d0d" stroke="#7a1a15" stroke-width="2"/>
  <text x="813" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4. Padrão</text>
  <text x="813" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">sinusoidal</text>
  <text x="813" y="140" text-anchor="middle" font-size="10" fill="#ffe8e8">pré-fibrilação /</text>
  <text x="813" y="153" text-anchor="middle" font-size="10" fill="#ffe8e8">assistolia</text>

  <text x="450" y="205" text-anchor="middle" font-size="13" fill="#b3261e" font-weight="bold">Qualquer alteração de ECG já indica gluconato de cálcio IV imediato — não espere o laboratório</text>
  <text x="450" y="230" text-anchor="middle" font-size="12" fill="#1a1a1a">Cálcio estabiliza a membrana; insulina+glicose, beta-agonista, resina e diálise tratam o potássio em si</text>
</svg>
