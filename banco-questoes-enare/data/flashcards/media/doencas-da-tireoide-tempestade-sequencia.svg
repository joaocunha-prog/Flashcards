<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="auto" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="260" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Tempestade tireotóxica — ordem do tratamento</text>

  <!-- Step 1 -->
  <rect x="20" y="70" width="180" height="100" rx="10" fill="#e8f0fe" stroke="#2c5aa0" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a63">1. Betabloqueador</text>
  <text x="110" y="122" text-anchor="middle" font-size="12" fill="#1a3a63">Propranolol</text>
  <text x="110" y="140" text-anchor="middle" font-size="11" fill="#1a3a63">(reduz conversão</text>
  <text x="110" y="155" text-anchor="middle" font-size="11" fill="#1a3a63">periférica T4→T3)</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="120" x2="238" y2="120" stroke="#555" stroke-width="3"/>
  <polygon points="238,113 250,120 238,127" fill="#555"/>

  <!-- Step 2 -->
  <rect x="252" y="70" width="180" height="100" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
  <text x="342" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a1a15">2. Tionamida</text>
  <text x="342" y="122" text-anchor="middle" font-size="12" fill="#7a1a15">Propiltiouracila (PTU)</text>
  <text x="342" y="140" text-anchor="middle" font-size="11" fill="#7a1a15">(bloqueia síntese +</text>
  <text x="342" y="155" text-anchor="middle" font-size="11" fill="#7a1a15">conversão T4→T3)</text>

  <!-- Arrow 2 -->
  <line x1="432" y1="120" x2="470" y2="120" stroke="#555" stroke-width="3"/>
  <polygon points="470,113 482,120 470,127" fill="#555"/>
  <text x="451" y="105" text-anchor="middle" font-size="10" fill="#b3261e">≥ 1 hora depois</text>

  <!-- Step 3 -->
  <rect x="484" y="70" width="180" height="100" rx="10" fill="#fff4e5" stroke="#b5651d" stroke-width="2"/>
  <text x="574" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4310">3. Iodo (Lugol)</text>
  <text x="574" y="122" text-anchor="middle" font-size="12" fill="#7a4310">Bloqueia liberação</text>
  <text x="574" y="140" text-anchor="middle" font-size="11" fill="#7a4310">hormonal aguda</text>
  <text x="574" y="155" text-anchor="middle" font-size="11" fill="#7a4310">(efeito Wolff-Chaikoff)</text>

  <!-- Arrow 3 -->
  <line x1="664" y1="120" x2="702" y2="120" stroke="#555" stroke-width="3"/>
  <polygon points="702,113 714,120 702,127" fill="#555"/>

  <!-- Step 4 -->
  <rect x="716" y="70" width="164" height="100" rx="10" fill="#e6f4ea" stroke="#1e7d32" stroke-width="2"/>
  <text x="798" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#134a1c">4. Corticoide</text>
  <text x="798" y="122" text-anchor="middle" font-size="12" fill="#134a1c">Hidrocortisona</text>
  <text x="798" y="140" text-anchor="middle" font-size="11" fill="#134a1c">(reduz conversão T4→T3</text>
  <text x="798" y="155" text-anchor="middle" font-size="11" fill="#134a1c">e cobre insuf. adrenal relativa)</text>

  <text x="450" y="210" text-anchor="middle" font-size="13" fill="#b3261e" font-weight="bold">Erro clássico: dar iodo ANTES da tionamida piora a tireotoxicose (fornece substrato para nova síntese hormonal)</text>
  <text x="450" y="235" text-anchor="middle" font-size="12" fill="#1a1a1a">+ tratar sempre o fator precipitante (infecção, cirurgia, suspensão da tionamida)</text>
</svg>
