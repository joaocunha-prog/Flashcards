<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="auto" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Afasia de Broca vs. Wernicke (esquema simplificado)</text>

  <!-- Schematic brain outline (lateral view, simplified blob, front = left) -->
  <path d="M 90 200 C 70 130, 150 80, 240 80 C 330 70, 430 90, 470 130 C 500 150, 500 190, 480 220 C 470 260, 420 290, 340 295 C 260 300, 180 290, 130 260 C 95 240, 90 220, 90 200 Z"
        fill="#f5f2ea" stroke="#555" stroke-width="2.5"/>
  <text x="115" y="115" font-size="12" fill="#555">frente</text>
  <text x="440" y="115" font-size="12" fill="#555">trás</text>

  <!-- Broca's area (frontal, lower posterior) -->
  <ellipse cx="230" cy="175" rx="55" ry="38" fill="#2c5aa0" fill-opacity="0.75" stroke="#1a3a63" stroke-width="2"/>
  <text x="230" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Broca</text>
  <text x="230" y="188" text-anchor="middle" font-size="10" fill="#ffffff">(frontal)</text>

  <!-- Wernicke's area (temporal posterior) -->
  <ellipse cx="365" cy="215" rx="55" ry="38" fill="#b3261e" fill-opacity="0.75" stroke="#7a1a15" stroke-width="2"/>
  <text x="365" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Wernicke</text>
  <text x="365" y="228" text-anchor="middle" font-size="10" fill="#ffffff">(temporal post.)</text>

  <!-- Comparison table -->
  <g font-size="13">
    <rect x="40" y="320" width="820" height="1" fill="#ccc"/>
    <text x="60" y="345" font-weight="bold" fill="#1a3a63">Broca:</text>
    <text x="140" y="345" fill="#1a1a1a">discurso NÃO fluente, esforçado · compreensão preservada · repetição prejudicada</text>
    <text x="60" y="368" font-weight="bold" fill="#7a1a15">Wernicke:</text>
    <text x="140" y="368" fill="#1a1a1a">discurso fluente mas incompreensível (jargonafasia) · compreensão prejudicada</text>
  </g>
</svg>
