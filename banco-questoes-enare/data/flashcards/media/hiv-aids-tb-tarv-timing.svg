<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Coinfecção TB-HIV: quando iniciar a TARV</text>

  <!-- Start box: RIPE -->
  <rect x="230" y="55" width="180" height="50" rx="8" fill="#eef2ff" stroke="#3b4ab0" stroke-width="2"/>
  <text x="320" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Diagnóstico de TB</text>
  <text x="320" y="95" text-anchor="middle" font-size="14" fill="#1a1a1a">Iniciar RIPE imediatamente</text>

  <!-- Arrow down -->
  <line x1="320" y1="105" x2="320" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="320,130 400,168 320,206 240,168" fill="#fff7e6" stroke="#b06a00" stroke-width="2"/>
  <text x="320" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Contagem</text>
  <text x="320" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">de CD4?</text>

  <!-- Left branch: CD4 < 200 -->
  <line x1="240" y1="168" x2="120" y2="168" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="158" text-anchor="middle" font-size="12" fill="#333333">CD4 &lt; 200</text>
  <rect x="20" y="190" width="200" height="60" rx="8" fill="#ffe9e9" stroke="#b02a2a" stroke-width="2"/>
  <text x="120" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">TARV em até 2 semanas</text>
  <text x="120" y="234" text-anchor="middle" font-size="12" fill="#1a1a1a">após início do RIPE</text>

  <!-- Right branch: CD4 >= 200 -->
  <line x1="400" y1="168" x2="520" y2="168" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="158" text-anchor="middle" font-size="12" fill="#333333">CD4 ≥ 200</text>
  <rect x="420" y="190" width="200" height="60" rx="8" fill="#e6f7ee" stroke="#1f7a4c" stroke-width="2"/>
  <text x="520" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">TARV em 8 semanas</text>
  <text x="520" y="234" text-anchor="middle" font-size="12" fill="#1a1a1a">(fim da fase intensiva)</text>

  <text x="320" y="280" text-anchor="middle" font-size="12" fill="#555555">Válido para TB não meníngea. Na meningite tuberculosa, TARV só após a 4ª</text>
  <text x="320" y="298" text-anchor="middle" font-size="12" fill="#555555">semana, independente do CD4 — risco maior de IRIS no SNC.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>
</svg>
