<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="780" height="380" fill="#ffffff"/>

  <!-- Step 0 -->
  <rect x="270" y="15" width="240" height="50" rx="8" fill="#1f3a5f"/>
  <text x="390" y="36" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Fezes diarreicas (não formadas)</text>
  <text x="390" y="53" text-anchor="middle" fill="#ffffff" font-size="12">com suspeita de C. difficile</text>

  <line x1="390" y1="65" x2="390" y2="95" stroke="#333333" stroke-width="2"/>

  <!-- Step 1: triagem -->
  <rect x="240" y="95" width="300" height="50" rx="8" fill="#455a64"/>
  <text x="390" y="116" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Triagem: GDH antígeno ou NAAT/PCR</text>
  <text x="390" y="133" text-anchor="middle" fill="#ffffff" font-size="12">(alta sensibilidade)</text>

  <line x1="390" y1="145" x2="180" y2="185" stroke="#333333" stroke-width="2"/>
  <line x1="390" y1="145" x2="600" y2="185" stroke="#333333" stroke-width="2"/>

  <!-- Negative branch -->
  <rect x="70" y="185" width="220" height="50" rx="8" fill="#2e7d32"/>
  <text x="180" y="207" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Triagem negativa</text>
  <text x="180" y="224" text-anchor="middle" fill="#ffffff" font-size="12">Provavelmente não é C. difficile</text>

  <!-- Positive branch -->
  <rect x="490" y="185" width="220" height="50" rx="8" fill="#ef6c00"/>
  <text x="600" y="207" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Triagem positiva</text>
  <text x="600" y="224" text-anchor="middle" fill="#ffffff" font-size="12">→ confirmar com toxina</text>

  <line x1="600" y1="235" x2="600" y2="265" stroke="#333333" stroke-width="2"/>

  <!-- Step 2: EIA toxina -->
  <rect x="480" y="265" width="240" height="46" rx="8" fill="#455a64"/>
  <text x="600" y="293" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">EIA de toxina A/B</text>

  <line x1="600" y1="311" x2="470" y2="345" stroke="#333333" stroke-width="2"/>
  <line x1="600" y1="311" x2="730" y2="345" stroke="#333333" stroke-width="2"/>

  <rect x="360" y="330" width="200" height="40" rx="8" fill="#2e7d32"/>
  <text x="460" y="355" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Toxina negativa: colonização</text>

  <rect x="580" y="330" width="180" height="40" rx="8" fill="#b71c1c"/>
  <text x="670" y="355" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Toxina positiva: tratar</text>
</svg>
