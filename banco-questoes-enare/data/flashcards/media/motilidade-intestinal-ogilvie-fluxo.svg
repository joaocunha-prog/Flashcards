<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 660" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="620" height="660" fill="#ffffff"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Síndrome de Ogilvie — manejo escalonado</text>

  <!-- Box 1: conservative -->
  <rect x="60" y="55" width="500" height="90" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="310" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">1. Tratamento conservador</text>
  <text x="310" y="102" text-anchor="middle" font-size="13" fill="#1a1a1a">Jejum · corrigir K+/Mg2+ · suspender opioides/anticolinérgicos</text>
  <text x="310" y="120" text-anchor="middle" font-size="13" fill="#1a1a1a">Sonda retal/nasogástrica · mobilização</text>

  <!-- arrow 1 -->
  <line x1="310" y1="145" x2="310" y2="180" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="168" font-size="12" fill="#555555">sem melhora em 24-48h</text>
  <text x="330" y="182" font-size="12" fill="#555555">ou ceco &gt;12 cm</text>

  <!-- Box 2: neostigmine -->
  <rect x="60" y="190" width="500" height="90" rx="8" fill="#fff4e0" stroke="#9a5b00" stroke-width="2"/>
  <text x="310" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">2. Neostigmina IV</text>
  <text x="310" y="237" text-anchor="middle" font-size="13" fill="#1a1a1a">SEMPRE com monitorização cardíaca contínua</text>
  <text x="310" y="255" text-anchor="middle" font-size="13" fill="#1a1a1a">(risco de bradicardia/assistolia — atropina disponível)</text>

  <!-- arrow 2 -->
  <line x1="310" y1="280" x2="310" y2="315" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="303" font-size="12" fill="#555555">falha ou contraindicação</text>

  <!-- Box 3: colonoscopy -->
  <rect x="60" y="325" width="500" height="80" rx="8" fill="#f2e9fb" stroke="#6a3aa0" stroke-width="2"/>
  <text x="310" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">3. Colonoscopia descompressiva</text>
  <text x="310" y="374" text-anchor="middle" font-size="13" fill="#1a1a1a">exclui obstrução mecânica residual e descomprime o cólon</text>

  <!-- arrow 3 -->
  <line x1="310" y1="405" x2="310" y2="440" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="428" font-size="12" fill="#555555">apenas se:</text>

  <!-- Box 4: surgery -->
  <rect x="60" y="450" width="500" height="90" rx="8" fill="#fdeaea" stroke="#c01c28" stroke-width="2"/>
  <text x="310" y="476" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">4. Cirurgia</text>
  <text x="310" y="498" text-anchor="middle" font-size="13" fill="#1a1a1a">Perfuração, isquemia ou peritonite</text>
  <text x="310" y="516" text-anchor="middle" font-size="13" fill="#1a1a1a">(cecostomia/colectomia)</text>

  <!-- footnote -->
  <rect x="60" y="565" width="500" height="70" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="310" y="588" text-anchor="middle" font-size="12" fill="#333333">Antes de iniciar qualquer etapa, excluir obstrução mecânica</text>
  <text x="310" y="606" text-anchor="middle" font-size="12" fill="#333333">por imagem (radiografia/TC de abdome).</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#555555"/>
    </marker>
  </defs>
</svg>
