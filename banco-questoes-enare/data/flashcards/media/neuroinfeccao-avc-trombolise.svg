<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">AVC isquêmico: o que a TC de crânio decide</text>

  <!-- Start box -->
  <rect x="200" y="55" width="240" height="50" rx="8" fill="#eef2ff" stroke="#3b4ab0" stroke-width="2"/>
  <text x="320" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Suspeita de AVC isquêmico</text>
  <text x="320" y="95" text-anchor="middle" font-size="13" fill="#1a1a1a">TC de crânio sem contraste</text>

  <line x1="320" y1="105" x2="320" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Decision diamond -->
  <polygon points="320,130 420,175 320,220 220,175" fill="#fff7e6" stroke="#b06a00" stroke-width="2"/>
  <text x="320" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Há hemorragia</text>
  <text x="320" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">na TC?</text>

  <!-- Right branch: SIM -->
  <line x1="420" y1="175" x2="540" y2="175" stroke="#555555" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="480" y="165" text-anchor="middle" font-size="12" fill="#333333">SIM</text>
  <rect x="440" y="200" width="180" height="60" rx="8" fill="#ffe9e9" stroke="#b02a2a" stroke-width="2"/>
  <text x="530" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">rtPA CONTRAINDICADO</text>
  <text x="530" y="244" text-anchor="middle" font-size="12" fill="#1a1a1a">(contraindicação absoluta)</text>

  <!-- Left branch: NÃO -->
  <line x1="220" y1="175" x2="100" y2="175" stroke="#555555" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="160" y="165" text-anchor="middle" font-size="12" fill="#333333">NÃO</text>
  <rect x="10" y="200" width="180" height="60" rx="8" fill="#e6f7ee" stroke="#1f7a4c" stroke-width="2"/>
  <text x="100" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Segue avaliação de</text>
  <text x="100" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">elegibilidade para rtPA</text>

  <text x="320" y="295" text-anchor="middle" font-size="12" fill="#555555">A ausência de hemorragia já basta para prosseguir — não existe</text>
  <text x="320" y="313" text-anchor="middle" font-size="12" fill="#555555">um "achado extra" que autorize a trombólise além disso.</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>
</svg>
