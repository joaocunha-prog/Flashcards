<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos do Mês</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Gastos do mês</h1>
      <p class="subtitle">Lance seus gastos por aqui ou pelo WhatsApp — eles são categorizados automaticamente.</p>
    </header>

    <form id="expense-form" class="card">
      <div class="field field-grow">
        <label for="description">Descrição</label>
        <input type="text" id="description" placeholder="ex: Supermercado Extra" required autocomplete="off">
      </div>
      <div class="field">
        <label for="amount">Valor (R$)</label>
        <input type="number" id="amount" placeholder="0,00" step="0.01" min="0.01" required>
      </div>
      <div class="field">
        <label for="date">Data</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label for="category">Categoria</label>
        <select id="category">
          <option value="auto">Detectar automaticamente</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Adicionar gasto</button>
    </form>

    <section class="card">
      <div class="toolbar">
        <div class="field">
          <label for="month-filter">Mês</label>
          <select id="month-filter"></select>
        </div>
        <div class="total-box">
          <span>Total no mês</span>
          <strong id="month-total">R$ 0,00</strong>
        </div>
      </div>

      <div id="summary" class="summary"></div>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Lançamentos</h2>
        <span id="count-label"></span>
      </div>
      <div class="table-wrap">
        <table id="expense-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th class="align-right">Valor</th>
              <th>Origem</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expense-list"></tbody>
        </table>
        <p id="empty-state" class="empty-state" hidden>Nenhum gasto lançado neste mês ainda.</p>
      </div>
    </section>
  </div>

  <script src="/shared/categorize.js"></script>
  <script src="app.js"></script>
</body>
</html>
